name: 'Android APK'

on:
  push:
    branches: [ 'master' ]
  workflow_dispatch:

jobs:
  apk:
    name: Android APK (debug)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build
        run: |
          cd platforms/android/project
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NBCraft-Android-APK
          path: platforms/android/project/app/build/outputs/apk/debug/*.apk
